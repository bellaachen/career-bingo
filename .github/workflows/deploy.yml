name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # Cloudflare Worker + D1. Skipped (site still deploys, sharing hidden) if the secrets aren't set.
  api:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Cloudflare secrets not set; deploying the site without sharing."; echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - name: Find or create the D1 database
        if: steps.check.outputs.enabled == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="career-bingo") | (.uuid // .id)' | head -1; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create career-bingo; ID=$(find_id); fi
          test -n "$ID" || { echo "::error::Could not find or create D1 database"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          echo "Using D1 database $ID"
      - name: Apply migrations
        if: steps.check.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply career-bingo --remote
      - name: Deploy Worker
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL" || { echo "::error::No workers.dev URL in deploy output"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Health check
        if: steps.check.outputs.enabled == 'true'
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "${{ steps.deploy.outputs.url }}/api/health" && exit 0; sleep 5; done
          exit 1

  build:
    needs: [test, api]
    if: always() && needs.test.result == 'success' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ needs.api.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
