name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # Cloudflare Worker + D1. Skipped (site still deploys, sharing hidden) if the secrets aren't set.
  api:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - id: check
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Trim stray spaces/newlines from copy-pasted secrets before wrangler sees them.
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]'); ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"; echo "::add-mask::$ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"; echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Cloudflare secrets not set; deploying the site without sharing."; echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - name: Find or create the D1 database
        if: steps.check.outputs.enabled == 'true'
        run: |
          # Surface wrangler's own error text as a run annotation when a command fails.
          run() {
            OUT=$("$@" 2>&1); RC=$?
            if [ $RC -ne 0 ]; then
              MSG=$(printf '%s' "$OUT" | sed 's/\x1b\[[0-9;]*m//g' | grep -vE '^\s*$|npm notice|Logs were written' | tail -8 | tr '\n' ' ')
              echo "::error title=$2 $3 $4 failed::$MSG" >> /tmp/wrangler-errors.txt; echo "$OUT" >&2; return 1
            fi
            printf '%s' "$OUT"
          }
          find_id() {
            run npx wrangler d1 list --json | node -e '
              let s = require("fs").readFileSync(0, "utf8"); s = s.slice(s.indexOf("["));
              const db = JSON.parse(s).find((d) => d.name === "career-bingo");
              process.stdout.write(db ? (db.uuid || db.id || "") : "")'
          }
          fail() { cat /tmp/wrangler-errors.txt 2>/dev/null; echo "::error::$1"; exit 1; }
          ID=$(find_id) || fail "Listing D1 databases failed"
          if [ -z "$ID" ]; then
            run npx wrangler d1 create career-bingo >/dev/null || fail "Creating the D1 database failed"
            ID=$(find_id) || fail "Listing D1 databases failed"
          fi
          test -n "$ID" || { echo "::error::Could not find or create D1 database"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          echo "Using D1 database $ID"
      - name: Apply migrations
        if: steps.check.outputs.enabled == 'true'
        run: |
          OUT=$(npx wrangler d1 migrations apply career-bingo --remote 2>&1); RC=$?; echo "$OUT"
          if [ $RC -ne 0 ]; then echo "::error title=migrations failed::$(printf '%s' "$OUT" | sed 's/\x1b\[[0-9;]*m//g' | grep -vE '^\s*$' | tail -8 | tr '\n' ' ')"; exit 1; fi
      - name: Deploy Worker
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        run: |
          OUT=$(npx wrangler deploy 2>&1); RC=$?; echo "$OUT" | tee deploy.log
          if [ $RC -ne 0 ]; then echo "::error title=wrangler deploy failed::$(printf '%s' "$OUT" | sed 's/\x1b\[[0-9;]*m//g' | grep -vE '^\s*$' | tail -8 | tr '\n' ' ')"; exit 1; fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL" || { echo "::error::No workers.dev URL in deploy output"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Health check
        if: steps.check.outputs.enabled == 'true'
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "${{ steps.deploy.outputs.url }}/api/health" && exit 0; sleep 5; done
          exit 1

  build:
    needs: [test, api]
    if: always() && needs.test.result == 'success' && needs.api.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ needs.api.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
