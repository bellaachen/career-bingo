# Cloudflare Worker API for Career Bingo (Phase 2: shared results)
name = "career-bingo-api"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Browser origins allowed to call the API (comma-separated). Origin = scheme + host, no path.
ALLOWED_ORIGINS = "https://bellaachen.github.io"
ALLOW_LOCALHOST = "0"

[[d1_databases]]
binding = "DB"
database_name = "career-bingo"
# Replaced by the deploy workflow with the real ID (looked up or created on first deploy).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"
